version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ridematching-postgres
    restart: always
    environment:
      POSTGRES_USER: ridematching
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret123}
      POSTGRES_DB: ridematching
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridematching"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ridematching-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridematching-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://ridematching:${POSTGRES_PASSWORD:-supersecret123}@postgres:5432/ridematching?schema=public
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - OLA_MAPS_API_KEY=${OLA_MAPS_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
