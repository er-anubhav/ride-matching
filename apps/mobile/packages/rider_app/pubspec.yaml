name: rider_app
description: "Mr. Rideo Rider Application - Premium dark-themed ride sharing application."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  geolocator: ^14.0.3
  go_router: ^13.0.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  
  # Local shared package
  shared:
    path: ../shared
  maplibre_gl: ^0.26.2
  http: ^1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21

