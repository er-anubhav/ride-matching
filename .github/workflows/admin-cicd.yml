name: Admin Dashboard CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-cicd.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Admin Dashboard
        run: |
          cd apps/admin
          npm ci
          npm run build

      - name: Upload Admin Dashboard Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: apps/admin/dist
