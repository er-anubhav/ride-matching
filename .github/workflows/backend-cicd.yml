name: Backend Production CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-cicd.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Compile Backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST || '222.167.207.239' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/mr-rideo
            cd /opt/mr-rideo
            
      - name: Sync Backend Files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST || '222.167.207.239' }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME || 'root' }}
          TARGET: '/opt/mr-rideo/'
          EXCLUDE: '/node_modules/, /dist/, /.git/'

      - name: Restart Production Docker Containers & Run Prisma DB Push
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST || '222.167.207.239' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mr-rideo
            cp -f .env.production .env 2>/dev/null || true
            docker compose up -d --build --force-recreate
            docker exec -t mrrideo-backend npx prisma db push
            curl -f http://localhost:8080/health || exit 1
