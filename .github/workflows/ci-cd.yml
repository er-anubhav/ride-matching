name: Unified Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Compile Backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Sync Backend Files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST || '222.167.207.239' }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME || 'root' }}
          TARGET: '/opt/mr-rideo/'
          EXCLUDE: '/node_modules/, /dist/, /.git/'

      - name: Restart Docker Containers & Sync Database
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST || '222.167.207.239' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mr-rideo
            cp -f .env.production .env 2>/dev/null || true
            docker compose up -d --build --force-recreate
            docker exec -t mrrideo-backend npx prisma db push
            curl -f http://localhost:8080/health || exit 1

  mobile-apps-build:
    name: Analyze & Build Mobile Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Setup Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace & Analyze
        run: |
          cd apps/mobile
          melos bootstrap
          melos exec -- flutter analyze

      - name: Build Rider App Release APK
        run: |
          cd apps/mobile/packages/rider_app
          flutter build apk --release \
            --dart-define=API_URL=http://222.167.207.239:8080/api \
            --dart-define=WS_URL=ws://222.167.207.239:8080/ride-tracking

      - name: Upload Rider App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rider-app-release
          path: apps/mobile/packages/rider_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Build Driver App Release APK
        run: |
          cd apps/mobile/packages/driver_app
          flutter build apk --release \
            --dart-define=API_URL=http://222.167.207.239:8080/api \
            --dart-define=WS_URL=ws://222.167.207.239:8080/ride-tracking

      - name: Upload Driver App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-release
          path: apps/mobile/packages/driver_app/build/app/outputs/flutter-apk/app-release.apk

  admin-dashboard-build:
    name: Build Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Admin Dashboard
        run: |
          cd apps/admin
          npm ci
          npm run build

      - name: Upload Admin Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: apps/admin/dist
